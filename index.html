d"><strong style="color:var(--gold)">03　出題範囲（複数選択可）</strong><div class="top"><button id="allGroups">全選択</button><button id="noneGroups">全解除</button></div></div><div id="groups" class="choices"></div><p class="muted" id="available" style="margin-top:10px" aria-live="polite"></p></div></div><div class="startrow"><button id="start" class="primary">ランダム出題開始</button></div><p id="error" class="error" role="alert"></p><details><summary>教材の表記について</summary>○は通常の活用表で形を立てない欄。括弧は教材によって省略される形や用例の少ない形などを示します。意味分類・活用型は採用教材と照合してください。例文は練習用の作例です。参考：<a href="https://www.kotomana-plus.net/dic-appendix/dk5/data/03_%E4%B8%BB%E8%A6%81%E5%8A%A9%E5%8B%95%E8%A9%9E%E6%B4%BB%E7%94%A8%E8%A1%A8.pdf" target="_blank" rel="noopener">主要助動詞活用表</a>、<a href="https://sukyojuku.com/kobun/grammar/jodoshi-shikibetsu/" target="_blank" rel="noopener">古文助動詞の識別・活用表</a>。リンク閲覧以外は通信不要です。</details></section><section id="quiz" class="hide" aria-live="polite"><div class="status"><span id="state" class="state"></span><span id="position"></span><span id="timer" class="timer"></span></div><div class="progress"><i id="bar"></i></div><div id="questionContent"></div><div class="actions" id="actions"></div><div class="keys" id="keys">Space：解答／次へ　｜　1：不正解　｜　2：正解</div></section><section id="result" class="summary hide"></section></main><script>

['ki','き','','r','連用形（例外：カ変・サ変の未然形）','（せ）|○|き|し|しか|○','特殊型','過去（体験過去）','「こし・せし」など未然形に付く形がある。'],

['kemu','けむ','','r','連用形','○|○|けむ|けむ|けめ|○','四段型','過去推量・過去の原因推量・過去の伝聞／婉曲','「けん」とも表記。'],
['tashi','たし','','r','連用形','（たく）/たから|たく/たかり|たし|たき/たかる|たけれ|○','ク活用型','希望','「まほし」と接続を区別。'],

['maji','まじ','','s','終止形（ラ変型は連体形）','（まじく）/まじから|まじく/まじかり|まじ|まじき/まじかる|まじけれ|○','シク活用型','打消推量・打消意志・不可能・打消当然・禁止・不適当','「べし」の打消に対応。'],
['rashi','らし','','s','終止形（ラ変型は連体形）','○|○|らし|らし|らし|○','無変化型','推定','根拠に基づく推定。「らしき」などの異形もある。'],

['nari1','なり','伝聞・推定の方','s','終止形（ラ変型は連体形）','○|（なり）|なり|なる|なれ|○','ラ変型','伝聞・推定','音や声、聞いた情報が手がかりになる。'],
['nari2','なり','断定・存在の方','n','体言・連体形','なら|なり/に|なり|なる|なれ|（なれ）','ナリ活用型','断定・存在','「に」も連用形。'],
['tari2','たり','断定の方','n','体言','たら|たり/と|たり|たる|たれ|たれ','タリ活用型','断定','漢文訓読調によく現れる。'],
['gotoshi','ごとし','','n','体言・連体形・助詞「が」「の」','（ごとく）|ごとく|ごとし|ごとき|○|○','ク活用型','比況・例示','「〜のようだ」「〜など」。'],
['ri','り','','x','サ変の未然形・四段の已然形','ら|り|り|る|れ|れ','ラ変型','完了・存続','サ未四已（さみしい）で覚える。']

const data=raw.map(([id,term,sub,group,conn,forms,type,meaning,note])=>({id,term,sub,group,conn,forms:forms.split('|'),type,meaning,note}));
// original practice sentences, with an unambiguous reading in the supplied context
const ex=[
['e01','zu','花咲か','ぬ','春は寂し。','ず','連体形','打消','「咲か」は四段未然形。後ろは体言「春」。','花が咲かない春は寂しい。'],
['e02','nu','花、今朝つひに咲き','ぬ','。','ぬ','終止形','完了','「咲き」は四段連用形。','花が今朝とうとう咲いた。'],
['e03','nari2','これは昔の絵','なり','。','なり','終止形','断定','体言「絵」に接続。','これは昔の絵である。'],
['e04','nari1','門の外にて人の声す。子の泣く','なり','。','なり','終止形','推定','聞こえる声から判断している。','門の外で人の声がする。子が泣いているようだ。'],
['e05','tari1','庭に花咲き','たり','。','たり','終止形','存続','「咲き」は四段連用形。咲いている状態。','庭に花が咲いている。'],
['e06','tari2','国の主','たる','者、民を思ふべし。','たり','連体形','断定','体言「主」に接続し、体言「者」に続く。','国の主である者は、民のことを思うべきだ。'],
['e07','ri','机の上に名を書け','る','札あり。','り','連体形','存続','「書け」は四段已然形。後ろは体言「札」。','机の上に名前が書いてある札がある。'],
['e08','zu','まだ文を読ま','ね','ば、答へ知らず。','ず','已然形','打消','「読ま」は未然形。「ねば」は已然形＋ば。','まだ手紙を読んでいないので、答えが分からない。'],
['e09','nu','雨降り','に','けり。','ぬ','連用形','完了','「降り」は連用形。後ろの「けり」も連用形接続。','雨が降ったのだなあ。'],
['e10','nari2','これは夢','に','あらず。','なり','連用形','断定','「にあらず」は「〜ではない」。','これは夢ではない。'],
['e11','ki','昔、われ見','し','山なり。','き','連体形','過去','後ろの体言「山」を修飾する。','昔、自分が見た山である。'],
['e12','beshi','約束は守る','べし','。','べし','終止形','当然','守る義務がある、という内容。','約束は守るべきだ。']

const modes={all:'接続・活用・意味',conn:'接続のみ',forms:'活用のみ',meaning:'意味のみ',identify:'識別問題',reverse:'逆引き（接続＋意味）',mixed:'総合ミックス'};
const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
$('modes').innerHTML=Object.entries(modes).map(([k,v])=>`<label class="choice"><input type="radio" name="mode" value="${k}" ${k==='all'?'checked':''}>${v}</label>`).join('');
$('groups').innerHTML=Object.entries(groups).map(([k,v])=>`<label class="choice"><input type="checkbox" name="group" value="${k}" checked>${v}（${data.filter(d=>d.group===k).length}）</label>`).join('');
const role=()=>document.querySelector('[name=role]:checked').value;
const mode=()=>document.querySelector('[name=mode]:checked').value; const selected=()=>[...document.querySelectorAll('[name=group]:checked')].map(x=>x.value);
// Reverse cards group every exact connection/meaning pair, so no arbitrary single-answer grading.
function pool(){const g=selected(),d=data.filter(x=>g.includes(x.group)),e=ex.filter(x=>g.includes(x.group));const rev=[];for(const a of d){let r=rev.find(x=>x.d.conn===a.conn&&x.d.meaning===a.meaning);if(r)r.matches.push(a);else rev.push({kind:'reverse',id:'rev-'+a.id,d:a,matches:[a]})}let m=mode();if(m==='identify')return e.map(x=>({kind:'identify',id:x.id,d:x}));if(m==='reverse')return rev;if(m==='mixed'){// One basic card per auxiliary, plus distinct sentence cards and reverse cards.
return [...d.map(x=>({kind:shuffle(['all','conn','forms','meaning'])[0],id:'basic-'+x.id,d:x})),...e.map(x=>({kind:'identify',id:x.id,d:x})),...rev]}
return d.map(x=>({kind:m,id:'basic-'+x.id,d:x}))}
function update(){const n=pool().length,c=$('count');for(const o of c.options){o.disabled=o.value!=='all'&&Number(o.value)>n}if(c.selectedOptions[0].disabled)c.value='all';$('available').textContent=`出題可能：${n}問　｜　同一セッション内は同一問題の重複なし`;$('start').disabled=!n;$('error').textContent=n?'':'出題できる範囲を選んでください。';$('auto').disabled=$('seconds').value==='0';$('studentSettings').classList.toggle('hide',role()!=='student');showHistory()}
$('setup').addEventListener('change',update);$('allGroups').onclick=()=>{document.querySelectorAll('[name=group]').forEach(x=>x.checked=true);update()};$('noneGroups').onclick=()=>{document.querySelectorAll('[name=group]').forEach(x=>x.checked=false);update()};
let queue=[],idx=0,revealed=false,grades=[],timerHandle=null,deadline=0,roundSeconds=0,roundAuto=false,screen='setup',retry=false,student=false,formStyle="recall",fields=[],picks={},studentMark=null;
const HISTORY='kobun-trainer-history-v2';
function readHistory(){try{const h=JSON.parse(localStorage.getItem(HISTORY)||'{}');return h&&typeof h==='object'&&!Array.isArray(h)?h:{}}catch{return {}}}
function historyKey(q){return q.kind+':'+q.id}
function saveHistory(q,mark){try{const h=readHistory(),k=historyKey(q),v=h[k]||{right:0,wrong:0,last:''};v[mark]=(v[mark]||0)+1;v.last=mark;h[k]=v;localStorage.setItem(HISTORY,JSON.stringify(h))}catch{}}
function showHistory(){try{localStorage.setItem(HISTORY+'-test','1');localStorage.removeItem(HISTORY+'-test')}catch{$('historyText').textContent='このブラウザでは履歴を保存できません。出題・採点は利用できます。';return}const values=Object.values(readHistory()).filter(v=>v&&typeof v==='object'),right=values.reduce((n,v)=>n+(v.right||0),0),wrong=values.reduce((n,v)=>n+(v.wrong||0),0),weak=values.filter(v=>v.last==='wrong').length; $('historyText').textContent=`このブラウザの履歴：${right+wrong} 回回答 ／ 前回不正解 ${weak} 種類（端末内のみ・氏名不要）`}
$('resetHistory').onclick=()=>{if(confirm('このブラウザの学習履歴を消去しますか？')){try{localStorage.removeItem(HISTORY)}catch{}showHistory()}};

function stopTimer(){clearInterval(timerHandle);timerHandle=null}
function showScreen(s){screen=s;$('app').classList.toggle('playing',s==='quiz');for(const k of ['setup','quiz','result'])$(k).classList.toggle('hide',k!==s);$('home').classList.toggle('hide',s==='setup');window.scrollTo(0,0)}
function start(q,again=false){if(!q.length)return;stopTimer();queue=shuffle(q);if(!again&&role()==='student'&&$('weakFirst').checked){const h=readHistory();queue.sort((a,b)=>Number(h[historyKey(b)]?.last==='wrong')-Number(h[historyKey(a)]?.last==='wrong'))}idx=0;grades=[];retry=again;if(!again){student=role()==='student';formStyle=document.querySelector('[name=formStyle]:checked').value;roundSeconds=Number($('seconds').value);roundAuto=$('auto').checked}showScreen('quiz');newQuestion()}
$('start').onclick=()=>{let p=shuffle(pool()),n=$('count').value;if(role()==='student'&&$('weakFirst').checked){const h=readHistory();p.sort((a,b)=>Number(h[historyKey(b)]?.last==='wrong')-Number(h[historyKey(a)]?.last==='wrong'))}start(n==='all'?p:p.slice(0,Number(n)))};
function block(label,value,detail='',wide=false){return `<div class="qbox ${wide?'wide':''}"><div class="qlabel">${label}</div><div class="value">${esc(value)}</div>${detail?`<p class="detail">${esc(detail)}</p>`:''}</div>`}
function formBlock(d){return `<div class="qbox wide"><div class="qlabel">② 活用形 ${revealed?'｜ '+esc(d.type):''}</div><div class="forms">${labels.map((l,i)=>`<div><span>${l}</span><strong>${revealed?esc(d.forms[i].replaceAll('/','\n')):'？'}</strong></div>`).join('')}</div>${revealed?'<p class="detail">○：活用形なし　／　括弧：教材によって省略される形など</p>':''}</div>`}

function makeField(key,label,correct,candidates,isForms=false){let others=shuffle([...new Set(candidates)].filter(x=>x!==correct));return {key,label,correct,options:shuffle([correct,...others.slice(0,2)]),isForms}}
function makeFields(q){const d=q.d,k=q.kind, f=[];if(k==='identify'){f.push(makeField('term','① 基本形',d.term,data.map(a=>a.term)),formStyle==='choice'?makeField('form','② 活用形',d.form,labels):{key:'form',label:'② 活用形',correct:d.form,recall:'single'},makeField('meaning','③ 文中での意味',d.meaning,ex.map(a=>a.meaning).concat(['受身','尊敬','自発','推量','意志','可能'])))}else if(k==='reverse'){const term=a=>a.term+(a.sub?'（'+a.sub.replace('の方','')+'）':'');f.push(makeField('term','該当する助動詞',q.matches.map(term).join('・'),data.filter(a=>!q.matches.includes(a)).map(term)))}else{if(k==='all'||k==='conn')f.push(makeField('conn','① 接続',d.conn,data.map(a=>a.conn)));if(k==='all'||k==='meaning')f.push(makeField('meaning','③ 意味（すべての組み合わせ）',d.meaning,data.map(a=>a.meaning)));if(k==='all'||k==='forms')f.push(formStyle==='choice'?{key:'forms',label:'② 活用形（6欄を選択）',correct:d.forms.join('|'),recall:'sixChoice',options:d.forms.map((v,i)=>formOptions(d,i))}:{key:'forms',label:'② 活用形（6欄を記入）',correct:d.forms.join('|'),recall:'six'})}return f}
// Free recall: split multiple forms, ignore order and parenthesis notation.
function normText(s){return String(s??'').normalize('NFKC').trim().replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-96))}
function tokens(s){return normText(s).replace(/[()（）]/g,'').split(/[\s、,・/／;；]+/).filter(Boolean).map(x=>/^(?:○|◯|〇|0|×|✕|[-ー—―]|なし|無し|活用なし|活用形なし)$/.test(x)?'○':x)}
function formCorrect(input,expected){const got=tokens(input);if(!got.length)return false;const required=[],optional=[];for(const part of expected.split('/')){const t=tokens(part)[0];if(part.startsWith('（')||part.startsWith('('))optional.push(t);else required.push(t)}if(!required.length&&optional.length&&got.length===1&&got[0]==='○')return true;const allowed=new Set([...required,...optional]);return got.every(x=>allowed.has(x))&&required.every(x=>got.includes(x))}
function formOptions(d,i){const correct=d.forms[i];const same=shuffle([...new Set(d.forms.filter((_,j)=>i!==j))]).filter(x=>!formCorrect(x,correct));const other=shuffle([...new Set(data.map(a=>a.forms[i]))]).filter(x=>!formCorrect(x,correct)&&!same.includes(x));return shuffle([correct,...[...same,...other].slice(0,2)])}
function fieldCorrect(f){if(f.recall==='sixChoice')return f.correct.split('|').every((v,i)=>f.options[i][picks[f.key]?.[i]]===v);if(f.recall==='six')return f.correct.split('|').every((v,i)=>formCorrect(picks[f.key]?.[i],v));if(f.recall==='single'){const n=normText(picks[f.key]).replace(/\s/g,'');const readings={'未然形':'みぜん','連用形':'れんよう','終止形':'しゅうし','連体形':'れんたい','已然形':'いぜん','命令形':'めいれい'};return [f.correct,f.correct.replace(/形$/,''),readings[f.correct],readings[f.correct]+'けい'].includes(n)}return f.options[picks[f.key]]===f.correct}
function fieldComplete(f){if(f.recall==='sixChoice')return Array.from({length:6},(_,i)=>picks[f.key]?.[i]).every(v=>v!==undefined&&v!==null&&v!=='');return f.recall==='six'?Array.from({length:6},(_,i)=>String(picks[f.key]?.[i]??'').trim()).every(Boolean):f.recall==='single'?Boolean(String(picks[f.key]??'').trim()):picks[f.key]!==undefined}
function fieldHTML(f){if(f.recall==='sixChoice'){const ans=f.correct.split('|');const correctAt=i=>f.options[i][picks[f.key]?.[i]]===ans[i];return `<div class="qbox wide"><div class="qlabel">${f.label}</div><div class="recall-grid">${labels.map((l,i)=>{const value=picks[f.key]?.[i],ok=correctAt(i);return `<div class="recall-cell ${revealed?(ok?'correct':'incorrect'):''}"><label for="choice-form-${i}">${l}</label><select id="choice-form-${i}" class="form-select ${revealed?(ok?'correct':'incorrect'):''}" data-form-choice="${i}" ${revealed?'disabled':''}><option value="" ${value===undefined||value===''?'selected':''}>選択</option>${f.options[i].map((v,j)=>`<option value="${j}" ${value===j?'selected':''}>${esc(v)}</option>`).join('')}</select>${revealed?`<div class="recall-result">${ok?'○ 正解':'× 正解：'}<br>${esc(ans[i].replaceAll('/','\n'))}</div>`:''}</div>`}).join('')}</div>${revealed?`<p class="recall-help">${ans.filter((_,i)=>correctAt(i)).length} / 6 欄正解　｜　${esc(queue[idx].d.type)}</p>`:'<p class="recall-help">六つの欄をそれぞれ選択。○は活用形なし。</p>'}</div>`}if(f.recall==='six'){const ans=f.correct.split('|');return `<div class="qbox wide"><div class="qlabel">${f.label}</div><div class="recall-grid">${labels.map((l,i)=>{const value=picks[f.key]?.[i]??'',ok=formCorrect(value,ans[i]);return `<div class="recall-cell ${revealed?(ok?'correct':'incorrect'):''}"><label for="recall-${i}">${l}</label><input class="recall-input" id="recall-${i}" type="text" data-recall="forms" data-index="${i}" value="${esc(value)}" autocomplete="off" autocapitalize="off" spellcheck="false" ${revealed?'disabled':''}>${revealed?`<div class="recall-result">${ok?'○ 正解':'× 正解：'}<br>${esc(ans[i].replaceAll('/','\n'))}</div>`:''}</div>`}).join('')}</div>${revealed?`<p class="recall-help">${ans.filter((v,i)=>formCorrect(picks[f.key]?.[i],v)).length} / 6 欄正解　｜　${esc(queue[idx].d.type)}</p>`:'<p class="recall-help">形がない欄は「○」または「なし」。複数ある場合は「/」や「・」で区切る。括弧付きの形は省略可。</p>'}</div>`}if(f.recall==='single')return `<div class="qbox"><div class="qlabel">${f.label}</div><input type="text" aria-label="活用形" class="recall-input ${revealed?(fieldCorrect(f)?'correct':'incorrect'):''}" data-recall="form" value="${esc(picks[f.key]??'')}" placeholder="活用形を記入" autocomplete="off" autocapitalize="off" spellcheck="false" ${revealed?'disabled':''}>${revealed?`<p class="recall-result">${fieldCorrect(f)?'○ 正解':'× 正解：'} ${esc(f.correct)}</p>`:''}</div>`;return `<div class="qbox ${fields.length===1||f.key==='meaning'&&queue[idx].kind==='identify'?'wide':''}"><div class="qlabel">${f.label}</div><div class="student-opt compact-options" role="group" aria-label="${esc(f.label)}">${f.options.map((v,i)=>revealed&&v!==f.correct&&picks[f.key]!==i?'':`<button type="button" data-field="${f.key}" data-option="${i}" aria-pressed="${picks[f.key]===i}" ${revealed?'disabled':''} class="${revealed&&v===f.correct?'rightChoice':revealed&&picks[f.key]===i?'wrongChoice':''}">${esc(v)}${revealed&&v===f.correct?'<span class="sr-only"> 正解</span>':''}</button>`).join('')}</div></div>`}
function drawStudent(){const q=queue[idx],d=q.d,k=q.kind;let html='';$('quiz').classList.toggle('answer',revealed);$('state').textContent=revealed?'ANSWER ／ 採点結果':'QUESTION ／ 問題';$('position').textContent=`${retry?'再挑戦　':''}${idx+1} / ${queue.length}　｜　${modes[k]}`;$('bar').style.width=`${(idx+1)/queue.length*100}%`;if(k==='identify')html=`<div class="hero"><div class="sentence">${esc(d.before)}<mark>${esc(d.focus)}</mark>${esc(d.after)}</div><div class="subterm">傍線部の基本形・活用形・意味を答えよう</div></div>`;else if(k==='reverse')html=`<div class="hero"><div class="sentence">該当する助動詞は？</div></div><div class="qgrid">${block('接続',d.conn)}${block('意味',d.meaning)}</div>`;else{const examples={nari1:'例：波の音すなり',nari2:'例：これは絵なり',tari1:'例：花咲きたり',tari2:'例：国の主たり'};html=`<div class="hero"><div class="term">${esc(d.term)}</div>${d.sub?`<div class="subterm">${esc(revealed?d.sub:examples[d.id])}</div>`:''}</div>`}
if(revealed){const n=fields.filter(fieldCorrect).length;html+=`<div class="studentFeedback ${studentMark==='right'?'goodText':'badText'}">${studentMark==='right'?'全項目正解！':'もう一度確認しよう'}　${n} / ${fields.length} 項目正解</div>`}
html+=`<div class="qgrid">${fields.map(fieldHTML).join('')}</div>`;if(revealed&&k!=='reverse')html+=`<p class="note">${k==='identify'?'根拠':'POINT'}：${esc(d.note)}${k==='identify'?'<br>現代語訳：'+esc(d.translation):''}</p>`;
$('questionContent').innerHTML=html;$('actions').innerHTML=revealed?'<button class="primary" id="studentNext">次の問題へ</button>':'<button class="primary" id="submitAnswer">採点する</button>';
if(revealed){$('studentNext').onclick=()=>grade(studentMark)}else{$('submitAnswer').disabled=!fields.every(fieldComplete);$('submitAnswer').onclick=submitStudent;document.querySelectorAll('[data-field]').forEach(b=>b.onclick=()=>{picks[b.dataset.field]=Number(b.dataset.option);document.querySelectorAll('[data-field="'+b.dataset.field+'"]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));$('submitAnswer').disabled=!fields.every(fieldComplete)});document.querySelectorAll('[data-form-choice]').forEach(el=>el.onchange=()=>{if(!picks.forms)picks.forms=[];picks.forms[Number(el.dataset.formChoice)]=el.value===''?'':Number(el.value);$('submitAnswer').disabled=!fields.every(fieldComplete)});document.querySelectorAll('[data-recall]').forEach(el=>el.oninput=()=>{if(el.dataset.recall==='forms'){if(!picks.forms)picks.forms=[];picks.forms[Number(el.dataset.index)]=el.value}else picks.form=el.value;$('submitAnswer').disabled=!fields.every(fieldComplete)})}}
function submitStudent(){if(screen!=='quiz'||revealed||!student)return;stopTimer();studentMark=fields.every(fieldCorrect)?'right':'wrong';saveHistory(queue[idx],studentMark);revealed=true;draw();window.scrollTo(0,0)}

function fitTeacher(){const quiz=$('quiz');quiz.classList.remove('tight');if(screen==='quiz'&&!student&&window.innerWidth>=641&&document.documentElement.scrollHeight>window.innerHeight+4)quiz.classList.add('tight')}
window.addEventListener('resize',fitTeacher);
function draw(){if(student){drawStudent();return}const q=queue[idx],d=q.d,k=q.kind;let html='';$('quiz').classList.toggle('answer',revealed);$('state').textContent=revealed?'ANSWER ／ 解答':'QUESTION ／ 問題';$('position').textContent=`${retry?'再挑戦　':''}${idx+1} / ${queue.length}　｜　${modes[k]}`;$('bar').style.width=`${(idx+1)/queue.length*100}%`;
if(k==='identify'){html=`<div class="hero"><div class="sentence">${esc(d.before)}<mark>${esc(d.focus)}</mark>${esc(d.after)}</div><div class="subterm">傍線部の基本形・活用形・意味は？</div></div><div class="qgrid">${block('① 基本形',revealed?d.term:'？')}${block('② 活用形',revealed?d.form:'？')}${block('③ 意味',revealed?d.meaning:'？','',true)}</div>${revealed?`<p class="note">根拠：${esc(d.note)}<br>現代語訳：${esc(d.translation)}</p>`:''}`}
else if(k==='reverse'){html=`<div class="hero"><div class="sentence">該当する助動詞は？</div><div class="subterm">接続の条件と意味の組み合わせが一致する助動詞を答えよう</div></div><div class="qgrid">${block('接続',d.conn)}${block('意味',d.meaning)}${block('解答',revealed?q.matches.map(a=>a.term+(a.sub?'（'+a.sub.replace('の方','')+'）':'')).join('・'):'？','',true)}</div>`}
else{const homonymExamples={nari1:'例：波の音すなり',nari2:'例：これは絵なり',tari1:'例：花咲きたり',tari2:'例：国の主たり'};let sub=d.sub?(revealed?d.sub:homonymExamples[d.id]):'';
html=`<div class="hero"><div class="term">${esc(d.term)}</div>${sub?`<div class="subterm">${esc(sub)}</div>`:''}</div><div class="qgrid">${k==='all'||k==='conn'?block('① 接続',revealed?d.conn:'何形に接続する？','',k==='conn'):''}${k==='all'||k==='meaning'?block('③ 意味',revealed?d.meaning:'どのような意味がある？','',k==='meaning'):''}${k==='all'||k==='forms'?formBlock(d):''}</div>${revealed?`<p class="note">POINT：${esc(d.note)}</p>`:''}`}
$('questionContent').innerHTML=html;$('actions').innerHTML=revealed?'<button class="bad" id="wrong">1　不正解</button><button class="good" id="right">2　正解</button><button class="skip" id="next">次へ（採点なし）</button>':'<button class="primary" id="reveal">解答を表示　Space</button>';
if(revealed){$('wrong').onclick=()=>grade('wrong');$('right').onclick=()=>grade('right');$('next').onclick=()=>grade('skip')}else $('reveal').onclick=reveal;fitTeacher();
}
function newQuestion(){stopTimer();revealed=false;fields=student?makeFields(queue[idx]):[];picks={};studentMark=null;$('quiz').classList.toggle('student',student);$('quiz').classList.toggle('complex',['all','identify','reverse'].includes(queue[idx].kind));$('quiz').classList.remove('tight');$('keys').textContent=student?(formStyle==='choice'?'選択 → 採点 → 次の問題へ':'選択・記入 → 採点 → 次の問題へ'):'Space：解答／次へ　｜　1：不正解　｜　2：正解';draw();window.scrollTo(0,0);$('timer').classList.remove('expired');if(!roundSeconds){$('timer').textContent='制限なし';return}deadline=Date.now()+roundSeconds*1000;tick();timerHandle=setInterval(tick,200)}
function tick(){const n=Math.max(0,Math.ceil((deadline-Date.now())/1000));$('timer').textContent=n?`残り ${n} 秒`:'時間切れ';if(!n){stopTimer();$('timer').classList.add('expired');if(roundAuto)(student?submitStudent():reveal())}}
function reveal(){if(screen!=='quiz'||revealed)return;stopTimer();revealed=true;draw()}
function grade(mark){if(screen!=='quiz'||!revealed)return;grades.push({q:queue[idx],mark});if(++idx>=queue.length){stopTimer();finish()}else newQuestion()}
function name(q){return q.kind==='identify'?`${q.d.before}${q.d.focus}${q.d.after}`:q.kind==='reverse'?`逆引き：${q.matches.map(a=>a.term).join('・')}`:q.d.term+(q.d.sub?'（'+q.d.sub.replace('の方','')+'）':'')+' ／ '+modes[q.kind]}
function finish(){showScreen('result');let right=grades.filter(g=>g.mark==='right').length,wrong=grades.filter(g=>g.mark==='wrong'),skip=grades.filter(g=>g.mark==='skip').length,marked=right+wrong.length;$('result').innerHTML=`<div class="eyebrow">SESSION COMPLETE</div><h2>復習終了</h2><div class="score">${marked?Math.round(right/marked*100)+'%':'—'}</div><p class="muted">${marked?'採点した問題の正答率':'採点なしで終了'}</p><div class="stats"><div class="panel">正解<strong>${right}</strong></div><div class="panel">不正解<strong>${wrong.length}</strong></div><div class="panel">採点なし<strong>${skip}</strong></div></div>${wrong.length?`<div class="panel review"><b>もう一度確認する問題</b>${wrong.map(g=>'<p>・'+esc(name(g.q))+'</p>').join('')}</div>`:''}<div class="actions">${wrong.length?'<button class="primary" id="retry">不正解だけ再出題</button>':''}<button id="again">同じ設定で再抽選</button><button id="back">設定に戻る</button></div>`;if(wrong.length)$('retry').onclick=()=>start(wrong.map(g=>g.q),true);$('again').onclick=()=>$('start').click();$('back').onclick=goHome}
function goHome(){stopTimer();showScreen('setup');update()}
$('home').onclick=()=>{if(screen!=='quiz'||confirm('現在の出題を終了して設定に戻りますか？'))goHome()};
$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement||document.webkitFullscreenElement){const exit=document.exitFullscreen||document.webkitExitFullscreen;await exit.call(document)}else{const enter=document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen;if(!enter)throw Error('unsupported');await enter.call(document.documentElement)}}catch(e){alert('このブラウザでは全画面APIが使えません。画面を横向きにするか、ブラウザの全画面機能をご利用ください。')}};
function fsLabel(){$('fullscreen').textContent=(document.fullscreenElement||document.webkitFullscreenElement)?'全画面解除':'全画面表示'}document.addEventListener('fullscreenchange',fsLabel);document.addEventListener('webkitfullscreenchange',fsLabel);
document.addEventListener('keydown',e=>{if(student||screen!=='quiz'||e.repeat||e.altKey||e.ctrlKey||e.metaKey||['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName))return;if(e.key===' '){e.preventDefault();revealed?grade('skip'):reveal()}else if(revealed&&['1','2','ArrowRight'].includes(e.key)){e.preventDefault();grade(e.key==='1'?'wrong':e.key==='2'?'right':'skip')}});update();
</script></body></html>
